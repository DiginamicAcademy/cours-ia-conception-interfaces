<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" role="img" aria-labelledby="tq fq" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="tq">Le triptyque de la spec d'écran, et sa quatrième flèche</title>
  <desc id="fq">Diagramme en flowchart de gauche à droite. À gauche, trois boîtes empilées : « Bloc 1 — Surface produit : données, actions, hiérarchie », « Bloc 2 — Contexte d'usage : qui, sur quoi, pour venir faire quoi », « Bloc 3 — Contraintes et goût : techniques, référentiels, références ». Chacune est reliée par une flèche pleine à une seule boîte à droite, « Écran ». Sous les trois boîtes, une quatrième boîte, couleur brique, porte « Ce que personne n'a décidé : le modèle le prend » ; une flèche en pointillés, plus épaisse que les trois autres, part de cette boîte, longe le bas du schéma, remonte et entre elle aussi dans la boîte « Écran ». Cette quatrième flèche est étiquetée « là où un bloc est silencieux ».</desc>

  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b5b8d"/>
    </marker>
    <marker id="fleche-alerte" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a4343a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="391" rx="6" fill="#ffffff"/>

  <!-- Bloc 1 -->
  <rect x="12" y="12" width="316" height="84" rx="8" fill="#eef2f9" stroke="#3b5b8d" stroke-width="1.6"/>
  <text x="26" y="44" font-size="16" font-weight="700" fill="#1f3f6b">Bloc 1 — Surface produit</text>
  <text x="26" y="66" font-size="15" fill="#1f3f6b">données, actions, hiérarchie</text>

  <!-- Bloc 2 -->
  <rect x="12" y="108" width="316" height="84" rx="8" fill="#eef2f9" stroke="#3b5b8d" stroke-width="1.6"/>
  <text x="26" y="137" font-size="16" font-weight="700" fill="#1f3f6b">Bloc 2 — Contexte d'usage</text>
  <text x="26" y="159" font-size="15" fill="#1f3f6b">qui, sur quoi,</text>
  <text x="26" y="178" font-size="15" fill="#1f3f6b">pour venir faire quoi</text>

  <!-- Bloc 3 -->
  <rect x="12" y="204" width="316" height="84" rx="8" fill="#eef2f9" stroke="#3b5b8d" stroke-width="1.6"/>
  <text x="26" y="233" font-size="16" font-weight="700" fill="#1f3f6b">Bloc 3 — Contraintes et goût</text>
  <text x="26" y="255" font-size="15" fill="#1f3f6b">techniques, référentiels,</text>
  <text x="26" y="274" font-size="15" fill="#1f3f6b">références</text>

  <!-- Ce que personne n'a décide -->
  <rect x="12" y="312" width="316" height="68" rx="8" fill="#fde8e8" stroke="#a4343a" stroke-width="1.8"/>
  <text x="26" y="341" font-size="15" font-weight="700" fill="#7a1f1f">Ce que personne n'a décidé :</text>
  <text x="26" y="361" font-size="15" font-weight="700" fill="#7a1f1f">le modèle le prend</text>

  <!-- Ecran -->
  <rect x="612" y="118" width="180" height="70" rx="8" fill="#dbe6f5" stroke="#3b5b8d" stroke-width="1.6"/>
  <text x="702" y="161" font-size="22" font-weight="700" fill="#1f3f6b" text-anchor="middle">Écran</text>

  <!-- Les trois fleches pleines -->
  <path d="M328,54 L606,142" fill="none" stroke="#3b5b8d" stroke-width="2" marker-end="url(#fleche)"/>
  <path d="M328,150 L606,153" fill="none" stroke="#3b5b8d" stroke-width="2" marker-end="url(#fleche)"/>
  <path d="M328,246 L606,164" fill="none" stroke="#3b5b8d" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- La quatrieme fleche -->
  <path d="M328,346 H702 V196" fill="none" stroke="#a4343a" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#fleche-alerte)"/>
  <text x="515" y="337" font-size="15" font-weight="700" fill="#a4343a" text-anchor="middle">là où un bloc est silencieux</text>

  <rect x="0.5" y="0.5" width="799" height="391" rx="6" fill="none" stroke="#d5d8de"/>
</svg>
