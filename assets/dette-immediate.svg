<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t2 d2" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="t2">Les trois dettes déjà présentes à la sortie de la machine</title>
  <desc id="d2">Trois panneaux côte à côte. Premier panneau, « les valeurs qui dérivent » : dix aplats de bleu presque identiques, rangés en deux lignes de cinq ; un seul, entouré d'un trait noir, est marqué « le contrat », celui du DESIGN.md ; les neuf autres viennent de l'outil. Deuxième panneau, « les composants dupliqués » : trois cartes produit de forme voisine mais légèrement différente, la première porte une pastille verte de correction, les deux autres une pastille vide à pointillé. Troisième panneau, « les fonctionnalités fantaisie » : trois pastilles de bouton — « Favoris » avec une étoile, « Code promo », « Voir plus » — chacune reliée par un trait pointillé qui s'arrête sur un mur, sans destinataire, avec le mot « rien ». Sous les trois panneaux, une plaque unique : « à l'écran, personne ne voit la dérive ».</desc>

  <defs>
    <symbol id="etoile-d" viewBox="0 0 20 20">
      <path d="M10 1.6l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L1.5 7.8l5.9-.8z"/>
    </symbol>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="429" rx="8" fill="#ffffff" stroke="#d5d8de"/>

  <!-- panneau 1 : les valeurs qui dérivent -->
  <rect x="24" y="20" width="232" height="310" rx="8" fill="#ffffff" stroke="#d5d8de"/>
  <text x="40" y="46" font-size="16" font-weight="700" fill="#1f2328">les valeurs</text>
  <text x="40" y="66" font-size="16" font-weight="700" fill="#1f2328">qui dérivent</text>

  <rect x="38" y="96" width="36" height="26" rx="3" fill="#2563eb" stroke="#1f2328" stroke-width="2"/>
  <rect x="80" y="96" width="36" height="26" rx="3" fill="#2a64ec" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="122" y="96" width="36" height="26" rx="3" fill="#1f5fe0" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="164" y="96" width="36" height="26" rx="3" fill="#2a68e8" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="206" y="96" width="36" height="26" rx="3" fill="#3167ef" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="38" y="130" width="36" height="26" rx="3" fill="#2459d6" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="80" y="130" width="36" height="26" rx="3" fill="#2f6ae4" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="122" y="130" width="36" height="26" rx="3" fill="#1d62e5" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="164" y="130" width="36" height="26" rx="3" fill="#3563e2" stroke="#b9c0ca" stroke-width="0.8"/>
  <rect x="206" y="130" width="36" height="26" rx="3" fill="#2768f0" stroke="#b9c0ca" stroke-width="0.8"/>

  <line x1="56" y1="158" x2="56" y2="172" stroke="#1f2328" stroke-width="1.2"/>
  <text x="40" y="188" font-size="15" font-weight="700" fill="#1f2328">le contrat</text>

  <text x="40" y="300" font-size="15" fill="#4b5563">un bleu posé</text>
  <text x="40" y="320" font-size="15" fill="#4b5563">dix écrits par l'outil</text>

  <!-- panneau 2 : les composants dupliqués -->
  <rect x="284" y="20" width="232" height="310" rx="8" fill="#ffffff" stroke="#d5d8de"/>
  <text x="300" y="46" font-size="16" font-weight="700" fill="#1f2328">les composants</text>
  <text x="300" y="66" font-size="16" font-weight="700" fill="#1f2328">dupliqués</text>

  <rect x="298" y="92" width="204" height="54" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
  <rect x="308" y="102" width="22" height="22" rx="2" fill="#e3e7ec"/>
  <rect x="344" y="106" width="100" height="7" rx="2" fill="#dfe3e8"/>
  <rect x="344" y="120" width="64" height="7" rx="2" fill="#dfe3e8"/>
  <rect x="428" y="126" width="62" height="12" rx="3" fill="#2563eb"/>
  <circle cx="502" cy="92" r="11" fill="#1f8a4c"/>
  <path d="M496.5 92l3.2 3.4 5.6-6.8" fill="none" stroke="#ffffff" stroke-width="2"/>

  <rect x="298" y="158" width="204" height="54" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
  <rect x="308" y="168" width="22" height="22" rx="2" fill="#e3e7ec"/>
  <rect x="344" y="172" width="88" height="7" rx="2" fill="#dfe3e8"/>
  <rect x="344" y="186" width="70" height="7" rx="2" fill="#dfe3e8"/>
  <rect x="428" y="192" width="56" height="12" rx="3" fill="#dfe3e8"/>
  <circle cx="502" cy="158" r="11" fill="#ffffff" stroke="#d98a12" stroke-width="1.6"/>
  <text x="502" y="163" font-size="15" font-weight="700" fill="#a8690a" text-anchor="middle">?</text>

  <rect x="298" y="224" width="204" height="54" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
  <rect x="308" y="234" width="22" height="22" rx="2" fill="#e3e7ec"/>
  <rect x="344" y="238" width="100" height="7" rx="2" fill="#dfe3e8"/>
  <rect x="344" y="252" width="58" height="7" rx="2" fill="#dfe3e8"/>
  <rect x="428" y="258" width="66" height="12" rx="3" fill="#dfe3e8"/>
  <circle cx="502" cy="224" r="11" fill="#ffffff" stroke="#d98a12" stroke-width="1.6"/>
  <text x="502" y="229" font-size="15" font-weight="700" fill="#a8690a" text-anchor="middle">?</text>

  <text x="300" y="300" font-size="15" fill="#4b5563">une copie corrigée</text>
  <text x="300" y="320" font-size="15" fill="#4b5563">deux, jamais signalées</text>

  <!-- panneau 3 : les fonctionnalités fantaisie -->
  <rect x="544" y="20" width="232" height="310" rx="8" fill="#ffffff" stroke="#d5d8de"/>
  <text x="560" y="46" font-size="16" font-weight="700" fill="#1f2328">les fonctionnalités</text>
  <text x="560" y="66" font-size="16" font-weight="700" fill="#1f2328">fantaisie</text>

  <rect x="568" y="112" width="132" height="36" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
  <use href="#etoile-d" x="580" y="120" width="20" height="20" fill="#e0a10a"/>
  <text x="606" y="135" font-size="16" fill="#1f2328">Favoris</text>
  <line x1="704" y1="130" x2="744" y2="130" stroke="#9aa3ad" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="744" y1="120" x2="744" y2="140" stroke="#9aa3ad" stroke-width="1.6"/>
  <text x="724" y="158" font-size="15" fill="#4b5563" text-anchor="middle">rien</text>

  <rect x="568" y="176" width="132" height="32" rx="6" fill="none" stroke="#c9ced6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="580" y="197" font-size="15" fill="#4b5563">Code promo</text>
  <line x1="704" y1="192" x2="744" y2="192" stroke="#9aa3ad" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="744" y1="182" x2="744" y2="202" stroke="#9aa3ad" stroke-width="1.6"/>

  <rect x="568" y="220" width="132" height="32" rx="6" fill="none" stroke="#c9ced6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="580" y="241" font-size="15" fill="#4b5563">Voir plus</text>
  <line x1="704" y1="236" x2="744" y2="236" stroke="#9aa3ad" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="744" y1="226" x2="744" y2="246" stroke="#9aa3ad" stroke-width="1.6"/>

  <text x="560" y="300" font-size="15" fill="#4b5563">la machine comble</text>
  <text x="560" y="320" font-size="15" fill="#4b5563">un blanc de la spec</text>

  <!-- plaque basse -->
  <rect x="184" y="348" width="432" height="58" rx="8" fill="#f6f7f9" stroke="#e3e6ea"/>
  <text x="400" y="384" font-size="16" fill="#1f2328" text-anchor="middle">à l'écran, personne ne voit la dérive</text>
</svg>
