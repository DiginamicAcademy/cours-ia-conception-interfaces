<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t3 d3" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="t3">Ce qui survit à l'outil : ce qui est dans votre dépôt, ce qui reste chez l'éditeur</title>
  <desc id="d3">Deux zones. En haut, une zone au contour pointillé intitulée « chez l'éditeur » : une seule étiquette, « la maquette », accompagnée de la mention « elle est empruntée · elle change, ou ferme ». En bas, une zone au contour plein intitulée « votre dépôt » : trois colonnes — « les trois temps » avec les commits spec(panier), gen(panier) et fix(panier) ; « les traces » avec les sorties des capteurs datées, l'export .zip versionné et le fichier de dépendances ; « la déclaration » avec ce qui est généré, ce qui est vérifié et ce qui reste non vérifié. Entre les deux zones, une flèche qui part de la zone du haut et entre dans la zone du bas, intitulée « la copie, versionnée et datée ».</desc>

  <rect x="0.5" y="0.5" width="799" height="399" rx="8" fill="#ffffff" stroke="#d5d8de"/>

  <!-- chez l'éditeur -->
  <rect x="24" y="20" width="752" height="78" rx="8" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="9 6"/>
  <text x="44" y="44" font-size="17" font-weight="700" fill="#1f2328">chez l'éditeur</text>
  <rect x="44" y="54" width="150" height="30" rx="6" fill="#f2f3f5" stroke="#d5d8de"/>
  <text x="119" y="74" font-size="16" fill="#1f2328" text-anchor="middle">la maquette</text>
  <text x="210" y="74" font-size="15" fill="#4b5563">elle est empruntée · elle change, ou ferme</text>

  <!-- le geste qui fait entrer -->
  <path d="M470 104V152H222V186" fill="none" stroke="#1f2328" stroke-width="2.5"/>
  <polygon points="222,196 213,180 231,180" fill="#1f2328"/>
  <text x="486" y="142" font-size="16" fill="#1f2328">la copie, versionnée et datée</text>

  <!-- votre dépôt -->
  <rect x="24" y="196" width="752" height="182" rx="8" fill="#f7f9fb" stroke="#c9ced6" stroke-width="1.4"/>
  <text x="44" y="222" font-size="17" font-weight="700" fill="#1f2328">votre dépôt</text>

  <text x="44" y="252" font-size="15" font-weight="700" fill="#4b5563">les trois temps</text>
  <text x="240" y="252" font-size="15" font-weight="700" fill="#4b5563">les traces</text>
  <text x="520" y="252" font-size="15" font-weight="700" fill="#4b5563">la déclaration</text>

  <text x="44" y="282" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#1f2328">spec(panier)</text>
  <text x="44" y="312" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#1f2328">gen(panier)</text>
  <text x="44" y="342" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="15" fill="#1f2328">fix(panier)</text>

  <text x="240" y="282" font-size="15" fill="#1f2328">sorties des capteurs, datées</text>
  <text x="240" y="312" font-size="15" fill="#1f2328">l'export .zip, versionné</text>
  <text x="240" y="342" font-size="15" fill="#1f2328">le fichier de dépendances</text>

  <text x="520" y="282" font-size="15" fill="#1f2328">ce qui est généré</text>
  <text x="520" y="312" font-size="15" fill="#1f2328">ce qui est vérifié</text>
  <text x="520" y="342" font-size="15" fill="#1f2328">ce qui reste non vérifié</text>
</svg>
