  <rect x="408" y="250" width="384" height="222" rx="8" fill="#ffffff" stroke="#d5d8de" stroke-width="1.2"/>
  <text x="422" y="277" font-size="18" font-weight="700" fill="#111827">Cas limites</text>

  <rect x="420" y="288" width="360" height="170" rx="5" fill="#ffffff" stroke="#d5d8de"/>
  <rect x="421" y="289" width="358" height="18" fill="#eceef2"/>
