  <circle cx="457" cy="55" r="3" fill="#28c840"/>
  <rect x="470" y="49" width="150" height="12" rx="6" fill="#ffffff" stroke="#dcdfe4" stroke-width="0.8"/>
  <text x="436" y="86" font-size="16" font-weight="700" fill="#111827">Votre panier</text>

  <rect x="436" y="98" width="28" height="28" rx="4" fill="#e3e6ea"/>
  <rect x="472" y="102" width="150" height="8" rx="4" fill="#e3e6ea"/>
  <rect x="472" y="114" width="95" height="8" rx="4" fill="#e3e6ea"/>
  <rect x="740" y="107" width="36" height="9" rx="4" fill="#d9dde3"/>
  <rect x="436" y="126" width="28" height="28" rx="4" fill="#e3e6ea"/>
  <rect x="472" y="130" width="150" height="8" rx="4" fill="#e3e6ea"/>
