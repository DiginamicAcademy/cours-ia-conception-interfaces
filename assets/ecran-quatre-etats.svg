  <circle cx="445" cy="297" r="3" fill="#febc2e"/>
  <circle cx="457" cy="297" r="3" fill="#28c840"/>
  <rect x="470" y="291" width="150" height="12" rx="6" fill="#ffffff" stroke="#dcdfe4" stroke-width="0.8"/>
  <text x="436" y="328" font-size="16" font-weight="700" fill="#111827">Votre panier</text>

  <rect x="432" y="338" width="26" height="26" rx="3" fill="none" stroke="#7b8593" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="468" y="348" font-size="15" fill="#111827">Confiture extra de</text>
  <text x="468" y="365" font-size="15" fill="#111827">châtaigne et vanille</text>
  <text x="468" y="382" font-size="15" fill="#111827">Bourbon de Madagascar…</text>
  <text x="768" y="370" font-size="15" fill="#111827" text-anchor="end">11,40 €</text>

  <rect x="432" y="398" width="26" height="26" rx="3" fill="none" stroke="#7b8593" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="468" y="416" font-size="15" fill="#111827">Noix fraîches décortiquées</text>
</svg>
