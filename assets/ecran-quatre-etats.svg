<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="f1t f1d" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="f1t">Le même écran de panier dessiné quatre fois : vide, chargement, erreur, cas limites</title>
  <desc id="f1d">Quatre panneaux, chacun intitulé par son état et contenant une fenêtre de navigateur sur le panier de Panier Local. En haut à gauche, l'état vide : le fait « Votre panier est vide », deux lignes grisées pour l'explication à écrire, et un bouton « Parcourir le catalogue ». En haut à droite, l'état de chargement : les formes grises de trois lignes de panier (carré photo, deux textes, prix à droite) et un bouton « Valider le panier » neutralisé en gris. En bas à gauche, l'état d'erreur : « Votre adresse de livraison n'a pas pu être enregistrée », le champ « Adresse de livraison » signalé d'un bord rouge, et une seule action, le bouton « Réessayer ». En bas à droite, les cas limites : le nom « Confiture extra de châtaigne et vanille Bourbon de Madagascar… » qui tourne sur trois lignes avec son prix « 11,40 € », et la ligne « Noix fraîches décortiquées » dont la colonne de prix reste vide. Les carrés en pointillés disent l'absence de photo.</desc>

