  <rect x="8" y="8" width="384" height="222" rx="8" fill="#ffffff" stroke="#d5d8de" stroke-width="1.2"/>
  <text x="22" y="35" font-size="18" font-weight="700" fill="#111827">Vide</text>

  <rect x="20" y="46" width="360" height="170" rx="5" fill="#ffffff" stroke="#d5d8de"/>
  <rect x="21" y="47" width="358" height="18" fill="#eceef2"/>
  <circle cx="33" cy="55" r="3" fill="#ff5f57"/>
  <circle cx="45" cy="55" r="3" fill="#febc2e"/>
  <circle cx="57" cy="55" r="3" fill="#28c840"/>
  <rect x="70" y="49" width="150" height="12" rx="6" fill="#ffffff" stroke="#dcdfe4" stroke-width="0.8"/>
  <text x="36" y="86" font-size="16" font-weight="700" fill="#111827">Votre panier</text>

  <text x="200" y="128" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">Votre panier est vide</text>
  <rect x="125" y="140" width="150" height="8" rx="4" fill="#d9dde3"/>
  <rect x="145" y="156" width="110" height="8" rx="4" fill="#d9dde3"/>
  <rect x="76" y="170" width="248" height="28" rx="6" fill="#1a7f43"/>
  <text x="200" y="189" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Parcourir le catalogue</text>

