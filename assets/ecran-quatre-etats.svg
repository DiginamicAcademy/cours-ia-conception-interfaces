  <text x="422" y="35" font-size="18" font-weight="700" fill="#111827">Chargement</text>

  <rect x="420" y="46" width="360" height="170" rx="5" fill="#ffffff" stroke="#d5d8de"/>
  <rect x="421" y="47" width="358" height="18" fill="#eceef2"/>
