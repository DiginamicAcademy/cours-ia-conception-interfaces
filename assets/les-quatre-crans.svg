<!-- Visuel de cours — écrit à la main, canevas 800x450, texte 15 px minimum.
     Source unique : 05-prototype-qui-devient-code.md, section I, tableau « Chaque cran de la
     chaîne ne pose pas la même question » (l. 35-40). Aucune donnée hors corpus.
     La colonne « Ce qu'il ne teste pas » du tableau n'est pas dessinée : elle reste dans le
     chapitre (plan 06-plan-visuels.md § IV, « étiquettes courtes, les phrases dans le markdown »).
     Passe 5 (chapitre 05) — voir -Peda/cadrage/06-plan-visuels.md § V-B et § XIV. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t1 d1" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="t1">Les quatre crans du prototype et la question que chacun teste</title>
  <desc id="d1">Escalier de quatre marches montantes de gauche à droite, numérotées de 1 à 4. Chaque marche porte l'objet du cran et la question que ce cran est censé trancher. Marche 1 : une maquette — l'idée est-elle juste ? Marche 2 : des écrans reliés — l'ordre tient-il ? Marche 3 : un projet — est-ce un projet, ou une page déguisée ? Marche 4 : une fonctionnalité — ce qu'on a dessiné existe-t-il dans les données ?</desc>

  <defs>
    <style>
      .objet { font-size: 15px; font-weight: 600; fill: #1f3f6b; }
      .question { font-size: 16px; fill: #16283d; }
      .numero { font-size: 16px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="449" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="1"/>

  <!-- le sol -->
  <line x1="8" y1="421" x2="792" y2="421" stroke="#3b5b8d" stroke-width="3"/>

  <!-- cran 1 : x 16..209, marche à y 300 -->
  <rect x="16" y="300" width="193" height="120" fill="#dbe6f5" stroke="#3b5b8d" stroke-width="2"/>
  <rect x="16" y="300" width="193" height="6" fill="#3b5b8d"/>
  <circle cx="42" cy="280" r="14" fill="#3b5b8d"/>
  <text class="numero" x="42" y="285.5" text-anchor="middle">1</text>
  <text class="objet" x="112.5" y="332" text-anchor="middle">une maquette</text>
  <line x1="38" y1="342" x2="187" y2="342" stroke="#a8bcd6" stroke-width="1"/>
  <text class="question" x="112.5" y="364" text-anchor="middle">l'idée est-elle</text>
  <text class="question" x="112.5" y="383" text-anchor="middle">juste ?</text>

  <!-- cran 2 : x 209..402, marche à y 250 -->
  <rect x="209" y="250" width="193" height="170" fill="#dbe6f5" stroke="#3b5b8d" stroke-width="2"/>
  <rect x="209" y="250" width="193" height="6" fill="#3b5b8d"/>
  <circle cx="235" cy="230" r="14" fill="#3b5b8d"/>
  <text class="numero" x="235" y="235.5" text-anchor="middle">2</text>
  <text class="objet" x="305.5" y="282" text-anchor="middle">des écrans reliés</text>
  <line x1="231" y1="292" x2="380" y2="292" stroke="#a8bcd6" stroke-width="1"/>
  <text class="question" x="305.5" y="314" text-anchor="middle">l'ordre tient-il ?</text>

  <!-- cran 3 : x 402..595, marche à y 200 -->
  <rect x="402" y="200" width="193" height="220" fill="#dbe6f5" stroke="#3b5b8d" stroke-width="2"/>
  <rect x="402" y="200" width="193" height="6" fill="#3b5b8d"/>
  <circle cx="428" cy="180" r="14" fill="#3b5b8d"/>
  <text class="numero" x="428" y="185.5" text-anchor="middle">3</text>
  <text class="objet" x="498.5" y="232" text-anchor="middle">un projet</text>
  <line x1="424" y1="242" x2="573" y2="242" stroke="#a8bcd6" stroke-width="1"/>
  <text class="question" x="498.5" y="264" text-anchor="middle">est-ce un projet,</text>
  <text class="question" x="498.5" y="283" text-anchor="middle">ou une page</text>
  <text class="question" x="498.5" y="302" text-anchor="middle">déguisée ?</text>

  <!-- cran 4 : x 595..788, marche à y 150 -->
  <rect x="595" y="150" width="193" height="270" fill="#dbe6f5" stroke="#3b5b8d" stroke-width="2"/>
  <rect x="595" y="150" width="193" height="6" fill="#3b5b8d"/>
  <circle cx="621" cy="130" r="14" fill="#3b5b8d"/>
  <text class="numero" x="621" y="135.5" text-anchor="middle">4</text>
  <text class="objet" x="691.5" y="182" text-anchor="middle">une fonctionnalité</text>
  <line x1="617" y1="192" x2="766" y2="192" stroke="#a8bcd6" stroke-width="1"/>
  <text class="question" x="691.5" y="214" text-anchor="middle">ce qu'on a</text>
  <text class="question" x="691.5" y="233" text-anchor="middle">dessiné</text>
  <text class="question" x="691.5" y="252" text-anchor="middle">existe-t-il dans</text>
  <text class="question" x="691.5" y="271" text-anchor="middle">les données ?</text>
</svg>
