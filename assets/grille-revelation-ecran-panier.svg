<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t2 d2" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="t2">Grille de révélation : le même écran de panier, avec quatre repères numérotés</title>
  <desc id="d2">Le même écran de panier de Panier Local, simplifié, entouré d'une fenêtre de navigateur. Quatre repères numérotés désignent quatre endroits : le 1, la ligne du badge « En stock » et des étoiles sur la première ligne de produit ; le 2, les deux boutons du récapitulatif ; le 3, une bande hachurée collée au bord droit de la fenêtre, qui marque la largeur unique de la page ; le 4, trois cadres vides en pointillés sous la fenêtre, qui marquent ce que l'écran n'a pas.</desc>

