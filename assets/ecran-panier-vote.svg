<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t1 d1" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="t1">Écran de panier de Panier Local, tel qu'il est projeté en ouverture du cours</title>
  <desc id="d1">Fenêtre de navigateur sur une page de panier : bandeau promotionnel, quatre lignes de produit avec photo, prix, badge « En stock », note en étoiles et nombre d'avis, producteur souligné comme un lien suivi d'une ville et d'une année, sélecteur de quantité. Les quatre lignes ne sont pas espacées de la même valeur. À droite, un récapitulatif avec un total en gris pâle, deux boutons côte à côte et une mention de paiement en gris pâle. Un pied de page occupe le bas de la page.</desc>

  <defs>
    <symbol id="etoile" viewBox="0 0 20 20">
