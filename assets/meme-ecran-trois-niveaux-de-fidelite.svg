  <rect x="285" y="222" width="230" height="28" rx="6" fill="#1a7f43"/>
  <text x="400" y="241" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Valider le panier</text>

  <!-- cran 3 : le prototype cliquable -->
  <text x="542" y="50" font-size="16" font-weight="700" fill="#1f3b5f">Prototype cliquable</text>
  <rect x="528" y="72" width="242" height="166" rx="8" fill="#f4f6f9" stroke="#c7cdd6" stroke-width="1"/>
