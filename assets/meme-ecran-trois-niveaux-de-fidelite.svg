<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t4 d4" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="t4">Le même panier rendu à trois niveaux de fidélité : croquis, maquette léchée, prototype cliquable</title>
  <desc id="d4">Trois panneaux posés en crans montants, de gauche à droite. Le premier, intitulé « Croquis », montre le panier en boîtes tracées à la main : une bande d'en-tête, trois lignes avec un carré, deux traits et un trait de prix, un trait de total et une boîte de bouton. Le deuxième, « Maquette léchée statique », montre le même panier avec sa barre de navigateur, son bandeau promotionnel, une ligne de produit avec photo, prix, badge « En stock » et étoiles, et un bouton vert « Valider le panier ». Le troisième, « Prototype cliquable », montre ce même écran avec un anneau de focus autour du bouton et une seconde fenêtre qui dépasse derrière. Sous les trois panneaux, une large flèche horizontale étiquetée « ce que jeter coûte », sans axe ni graduation.</desc>

  <defs>
    <symbol id="e4" viewBox="0 0 20 20">
      <path d="M10 1.6l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9L1.5 7.8l5.9-.8z"/>
    </symbol>
  </defs>

