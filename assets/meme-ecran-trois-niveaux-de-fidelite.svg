  <text x="16" y="142" font-size="16" font-weight="700" fill="#1f3b5f">Croquis</text>
  <g transform="rotate(-0.8 137 240)" stroke="#4a5568" stroke-width="2" fill="none" stroke-linecap="round">
    <rect x="32" y="168" width="180" height="13"/>
    <rect x="32" y="196" width="26" height="26"/>
    <line x1="66" y1="202" x2="156" y2="202"/>
    <line x1="66" y1="214" x2="136" y2="214"/>
    <line x1="176" y1="208" x2="206" y2="208" stroke-width="4"/>
    <rect x="32" y="228" width="26" height="26"/>
    <line x1="66" y1="234" x2="150" y2="234"/>
    <line x1="66" y1="246" x2="128" y2="246"/>
    <line x1="176" y1="240" x2="206" y2="240" stroke-width="4"/>
    <rect x="32" y="260" width="26" height="26"/>
    <line x1="66" y1="266" x2="160" y2="266"/>
    <line x1="66" y1="278" x2="140" y2="278"/>
    <line x1="176" y1="272" x2="206" y2="272" stroke-width="4"/>
    <line x1="100" y1="298" x2="170" y2="298" stroke-width="3"/>
    <rect x="180" y="288" width="52" height="18"/>
  </g>

  <!-- cran 2 : la maquette léchée -->
  <text x="279" y="96" font-size="16" font-weight="700" fill="#1f3b5f">Maquette léchée statique</text>
  <rect x="279" y="104" width="242" height="166" rx="8" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
  <rect x="285" y="112" width="230" height="8" rx="4" fill="#eceef2"/>
  <rect x="285" y="126" width="230" height="12" fill="#fdf6e3"/>
  <rect x="285" y="146" width="34" height="34" rx="4" fill="#fbf0d9"/>
  <rect x="294" y="153" width="16" height="22" rx="3" fill="#e6b04a"/>
  <text x="328" y="160" font-size="15" font-weight="700" fill="#111827">9,50 €</text>
  <text x="328" y="180" font-size="15" fill="#1a1a1a">Miel de châtaignier</text>
  <rect x="285" y="190" width="88" height="17" rx="8.5" fill="#e7f6ec"/>
  <text x="329" y="202.5" font-size="15" font-weight="700" fill="#1a7f43" text-anchor="middle">En stock</text>
  <use href="#e4" x="382" y="192" width="10" height="10" fill="#e0a10a"/>
  <use href="#e4" x="392" y="192" width="10" height="10" fill="#e0a10a"/>
  <use href="#e4" x="402" y="192" width="10" height="10" fill="#e0a10a"/>
  <use href="#e4" x="412" y="192" width="10" height="10" fill="#e0a10a"/>
