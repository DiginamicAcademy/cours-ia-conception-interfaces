  <rect x="548" y="176" width="230" height="28" rx="6" fill="#1a7f43"/>
  <text x="663" y="195" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Valider le panier</text>
  <rect x="543" y="170" width="240" height="40" rx="12" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="543" y="170" width="240" height="40" rx="12" fill="none" stroke="#1f3b5f" stroke-width="2.5"/>

  <!-- la bande fléchée, sans axe ni graduation -->
  <path d="M16 336 H734 V320 L784 353 L734 386 V370 H16 Z" fill="#dbe6f5" stroke="#3b5b8d" stroke-width="1.5"/>
  <text x="375" y="359" font-size="16" font-weight="700" fill="#1f3b5f" text-anchor="middle">ce que jeter coûte</text>
</svg>
